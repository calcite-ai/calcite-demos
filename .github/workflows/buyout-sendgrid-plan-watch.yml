# Warn if SendGrid is still on free trial near / after upgrade window.
# Does not send mail. Soft-fail (exit 2) when still free on/after warn date.
# Extra cron on 2026-10-15 posts an upgrade-day ping.
name: Buyout SendGrid plan watch

on:
  schedule:
    # Mondays 09:00 JST = Sunday 00:00 UTC
    - cron: "0 0 * * 1"
    # 2026-10-15 09:00 JST = 00:00 UTC (also fires later years; gate by date in script)
    - cron: "0 0 15 10 *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check SendGrid plan
        id: plan
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_UPGRADE_WARN_FROM: "2026-10-08"
        run: |
          if [ -z "$SENDGRID_API_KEY" ]; then
            echo "SKIP no SENDGRID_API_KEY secret yet"
            echo "status=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          out=$(node buyout-ops/check-sendgrid-plan.mjs --json)
          code=$?
          set -e
          echo "$out"
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          account_type=$(echo "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).account_type||''))")
          today_jst=$(echo "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).today_jst||''))")
          is_free=$(echo "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).is_free?'true':'false'))")
          echo "account_type=$account_type" >> "$GITHUB_OUTPUT"
          echo "today_jst=$today_jst" >> "$GITHUB_OUTPUT"
          echo "is_free=$is_free" >> "$GITHUB_OUTPUT"
          if [ "$today_jst" = "2026-10-15" ] && [ "$is_free" = "true" ]; then
            echo "status=upgrade_day" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" = "2" ]; then
            echo "status=needs_upgrade" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "0" ]; then
            echo "status=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Upgrade-day ping (2026-10-15)
        if: steps.plan.outputs.status == 'upgrade_day'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 8 --repo "${{ github.repository }}" --body "$(cat <<'EOF'
          ## 本日 2026-10-15 — SendGrid Essentials へアップグレード

          方針どおり **今日** Email API → Essentials 50K（~$19.95）を実行してください。
          トライアル終了は **2026-10-29**。未対応だと buyout 送信が止まります。

          手順: `buyout-ops/SENDGRID_UPGRADE_RUNBOOK.md`
          Dashboard: https://app.sendgrid.com/settings/account
          EOF
          )"
          exit 1

      - name: Comment on upgrade issue if still free after warn date
        if: steps.plan.outputs.status == 'needs_upgrade'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 8 --repo "${{ github.repository }}" --body "$(cat <<'EOF'
          ## SendGrid plan watch — still free

          Account type is still **free** on/after 2026-10-08.
          Trial ends **2026-10-29**. Upgrade Email API → Essentials (~10/15 target).

          Runbook: `buyout-ops/SENDGRID_UPGRADE_RUNBOOK.md`
          Issue: https://github.com/calcite-ai/calcite-demos/issues/8
          EOF
          )"
          exit 1

# Poll ConoHa IMAP for buyout replies; auto-send 66k checkout when safe.
name: Buyout inbox process

on:
  schedule:
    # every 2 hours
    - cron: "20 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no SMTP send / no CSV write)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: buyout-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: buyout-ops
        run: npm install --omit=dev

      - name: Process inbox
        id: inbox
        env:
          BUYOUT_MAIL_PROVIDER: ${{ secrets.BUYOUT_MAIL_PROVIDER }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          BUYOUT_SMTP_USER: ${{ secrets.BUYOUT_SMTP_USER }}
          BUYOUT_SMTP_PASS: ${{ secrets.BUYOUT_SMTP_PASS }}
          BUYOUT_SMTP_HOST: ${{ secrets.BUYOUT_SMTP_HOST }}
          BUYOUT_SMTP_PORT: ${{ secrets.BUYOUT_SMTP_PORT }}
          BUYOUT_IMAP_HOST: ${{ secrets.BUYOUT_IMAP_HOST }}
          BUYOUT_IMAP_PORT: ${{ secrets.BUYOUT_IMAP_PORT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node buyout-ops/inbox-process.mjs --dry-run
            echo "dry=1" >> "$GITHUB_OUTPUT"
          else
            node buyout-ops/inbox-process.mjs
            echo "dry=0" >> "$GITHUB_OUTPUT"
          fi

      # Only when this run recorded a recipient bounce (mailbox full / hard / soft).
      # Spam-like bounce → escalate only (bounce_failover=0). Never pre-10:00 blast.
      - name: Same-day failover send if bounce freed quota
        if: steps.inbox.outputs.dry != '1' && steps.inbox.outputs.bounce_failover == '1'
        env:
          BUYOUT_SMTP_USER: ${{ secrets.BUYOUT_SMTP_USER }}
          BUYOUT_SMTP_PASS: ${{ secrets.BUYOUT_SMTP_PASS }}
          BUYOUT_SMTP_HOST: ${{ secrets.BUYOUT_SMTP_HOST }}
          BUYOUT_SMTP_PORT: ${{ secrets.BUYOUT_SMTP_PORT }}
        run: node buyout-ops/daily-send-one.mjs

      - name: Commit CSV / escalate / state if changed
        run: |
          git config user.name "buyout-inbox"
          git config user.email "hello@calcite-ai.jp"
          # Add only paths that exist (missing escalate used to fail the whole git add)
          for f in \
            buyout-ops/demo_buyout_leads.csv \
            buyout-ops/metrics/inbox-processed.json \
            buyout-ops/metrics/inbox-escalate.md; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Process buyout inbox replies (IMAP)."
          git push origin HEAD:main
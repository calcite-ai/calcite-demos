# Daily outreach send (10:00 JST + afternoon catch-up)
# HP buyout + inside sales: 1+1/day from 2026-09-01 (send-quota.csv)
#
# Requires repo secrets:
#   BUYOUT_SMTP_USER / BUYOUT_SMTP_PASS / BUYOUT_SMTP_HOST / BUYOUT_SMTP_PORT
#   (9/11〜) BUYOUT_MAIL_PROVIDER=sendgrid + SENDGRID_API_KEY
#            BUYOUT_SMTP_USER=hello@calcite-mail.jp
#            BUYOUT_SMTP_PASS は IMAP用にConoHaのまま残す（daily-sendでは未使用可）
#
# Triggers:
#   - schedule: GitHub cron is flaky on public repos (01:00 UTC often skipped). Multiple slots + 15:00 JST catch-up.
#   - push main: fires after 9:00 demo queue push (demo_buyout_leads / buyout-prospects). Idempotent via remaining_today.
#
# Sends text/plain only (no Gmail MCP / no htmlBody).
# remaining_today=0 なら即 skip（二重送信なし）。

name: Buyout daily send

on:
  schedule:
    # 10:00 JST = 01:00 UTC（本命 — 遅延・スキップ多い）
    - cron: "0 1 * * *"
    # 11:00–13:00 JST バックアップ（01:00 が飛んだ日の回収）
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
    # 15:00 JST = 06:00 UTC（午後 catch-up）
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "buyout-ops/demo_buyout_leads.csv"
      - "buyout-ops/inside_sales_poc_leads.csv"
      - "buyout-prospects/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not send / do not mark sent)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: buyout-daily-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SMTP deps
        working-directory: buyout-ops
        run: npm install --omit=dev

      - name: Daily send buyout (remaining quota)
        env:
          BUYOUT_MAIL_PROVIDER: ${{ secrets.BUYOUT_MAIL_PROVIDER }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          BUYOUT_SMTP_USER: ${{ secrets.BUYOUT_SMTP_USER }}
          BUYOUT_SMTP_PASS: ${{ secrets.BUYOUT_SMTP_PASS }}
          BUYOUT_SMTP_HOST: ${{ secrets.BUYOUT_SMTP_HOST }}
          BUYOUT_SMTP_PORT: ${{ secrets.BUYOUT_SMTP_PORT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node buyout-ops/daily-send-one.mjs --dry-run
          else
            node buyout-ops/daily-send-one.mjs
          fi

      - name: Daily send inside (remaining quota)
        env:
          BUYOUT_MAIL_PROVIDER: ${{ secrets.BUYOUT_MAIL_PROVIDER }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          BUYOUT_SMTP_USER: ${{ secrets.BUYOUT_SMTP_USER }}
          BUYOUT_SMTP_PASS: ${{ secrets.BUYOUT_SMTP_PASS }}
          BUYOUT_SMTP_HOST: ${{ secrets.BUYOUT_SMTP_HOST }}
          BUYOUT_SMTP_PORT: ${{ secrets.BUYOUT_SMTP_PORT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node buyout-ops/daily-send-inside-one.mjs --dry-run
          else
            node buyout-ops/daily-send-inside-one.mjs
          fi

      - name: Commit sent CSV / escalate if changed
        run: |
          git config user.name "buyout-daily-send"
          git config user.email "hello@calcite-ai.jp"
          for f in \
            buyout-ops/demo_buyout_leads.csv \
            buyout-ops/inside_sales_poc_leads.csv \
            buyout-ops/metrics/inbox-escalate.md; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No CSV changes"
            exit 0
          fi
          git commit -m "Mark outreach lead sent (GitHub Actions daily send)."
          git push origin HEAD:main

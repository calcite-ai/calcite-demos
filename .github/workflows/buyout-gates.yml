name: Buyout gates

on:
  push:
    branches: [main]
    paths:
      - "buyout-ops/**"
      - "buyout-prospects/**"
      - "works/**"
      - "buyout-template/designs/swap-prospect.mjs"
      - "buyout-template/designs/publish-prospect.mjs"
      - ".github/workflows/buyout-gates.yml"
  pull_request:
    paths:
      - "buyout-ops/**"
      - "buyout-prospects/**"
      - "buyout-template/designs/swap-prospect.mjs"
      - "buyout-template/designs/publish-prospect.mjs"
      - ".github/workflows/buyout-gates.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ops pack (templates, repo hygiene)
        run: node buyout-ops/verify-ops-pack.mjs

      - name: G1 gate on queued leads (modern-site exclusion)
        run: node buyout-ops/verify-hunter-g1.mjs --from-csv --queued

      # 実際に次に送る社を検査する。固定1社だけだと、その社が通る経路しか
      # 守られない（2026-09-07: URL を works/ に移したのに旧パスの日南しか
      # 見ておらず、本文ゲートの取り残しを CI が見逃して当日の送信が失敗）
      - name: Live demo gate (queued leads)
        run: |
          set +e
          out=$(node buyout-ops/verify-before-send.mjs --from-csv --queued 2>&1)
          code=$?
          echo "$out"
          # exit 2 = 対象なし（queued が空の日は正常）。それ以外の非0は FAIL
          if [ "$code" -eq 2 ] && echo "$out" | grep -q "No targets"; then
            echo "queued なし — skip"; exit 0
          fi
          exit "$code"

      - name: Live demo gate (legacy path regression)
        run: |
          node buyout-ops/verify-before-send.mjs \
            --from-csv \
            --company "株式会社日南工務店"

      - name: Legacy cohort must block 66k checkout
        run: |
          if node buyout-ops/verify-inbox-reply.mjs \
            --company "株式会社日南工務店" \
            --template checkout; then
            echo "expected verify-inbox-reply to fail for legacy cohort"
            exit 1
          fi
          echo "legacy checkout correctly blocked"
